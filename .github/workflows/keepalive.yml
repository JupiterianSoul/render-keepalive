name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping
        env:
          PING_URL: ${{ secrets.PING_URL }}
        run: curl -fsS --max-time 90 -o /dev/null "$PING_URL"
